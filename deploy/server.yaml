# folie-server: controller + message API + the only process holding database credentials.
# ${FOLIE_SERVER_IMAGE} and ${FOLIE_AGENT_IMAGE} are substituted by `folie up`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: folie-server
  namespace: folie
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: folie-server
  namespace: folie
  labels:
    app.kubernetes.io/name: folie-server
    app.kubernetes.io/part-of: folie
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: folie-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: folie-server
    spec:
      serviceAccountName: folie-server
      containers:
        - name: folie-server
          image: ${FOLIE_SERVER_IMAGE}
          # Optional secret `folie-agent-env`: keys FOLIE_AGENT_ENV_<NAME> are injected into every agent task as <NAME>.
          envFrom:
            - secretRef:
                name: folie-agent-env
                optional: true
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: folie-postgres
                  key: password
            - name: DATABASE_URL
              value: postgres://folie:$(PGPASSWORD)@folie-postgres.folie.svc.cluster.local:5432/folie?sslmode=disable
            - name: AX_ADDR
              value: ax-server.ax-system.svc.cluster.local:8080
            - name: FOLIE_AGENT_IMAGE
              value: ${FOLIE_AGENT_IMAGE}
            - name: FOLIE_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: folie-operator-token
                  key: token
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # Same projections ax-server uses to call Substrate: a token for api.ate-system.svc and its TLS CA.
          volumeMounts:
            - mountPath: /var/run/secrets/ateapi
              name: ate-token
              readOnly: true
            - mountPath: /run/servicedns-ca
              name: servicedns-ca
              readOnly: true
      volumes:
        - name: ate-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 7200
                  path: token
        - name: servicedns-ca
          projected:
            defaultMode: 420
            sources:
              - clusterTrustBundle:
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
                  signerName: servicedns.podcert.ate.dev/identity
---
apiVersion: v1
kind: Service
metadata:
  name: folie-server
  namespace: folie
  labels:
    app.kubernetes.io/name: folie-server
    app.kubernetes.io/part-of: folie
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: folie-server
